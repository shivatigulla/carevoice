# Render Blueprint: the CareVoice backend API (+ background jobs in-process).
# Deploy: Render dashboard → New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for once.
services:
  - type: web
    name: carevoice-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RUN_SCHEDULER
        value: "true"
      - key: TZ
        value: Asia/Kolkata
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_SUMMARY_MODEL
        value: gpt-4.1-mini
      - key: SARVAM_STT_MODEL
        value: saaras:v3
      - key: SARVAM_TTS_MODEL
        value: bulbul:v3
      - key: TELEPHONY_PROVIDER
        value: exotel
      # Your Vercel URL(s), comma-separated, e.g. https://carevoice.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      - key: BOLNA_AGENT_ID
        sync: false
      - key: INTERNAL_API_KEY
        generateValue: true
